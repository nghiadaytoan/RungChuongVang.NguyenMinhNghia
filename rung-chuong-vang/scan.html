<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Máy quét – Rung Chuông Vàng</title>
<link rel="stylesheet" href="css/main.css">
<style>
  body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  .wrap{max-width:560px;margin:0 auto;padding:12px}
  #conn{font-size:13px;text-align:center;margin-bottom:6px}
  #vwrap{position:relative;border-radius:14px;overflow:hidden;background:#000;box-shadow:var(--sh)}
  video{width:100%;display:block;max-height:46vh;object-fit:cover}
  #cnt{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.78));
    padding:16px 12px 9px;text-align:center}
  #cnt b{font-size:34px;color:var(--gold);font-variant-numeric:tabular-nums}
  #state{text-align:center;margin:9px 0;font-weight:700;font-size:15px;color:#ffe9b0}
  .pad{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:10px 0}
  .pad .btn{padding:16px 10px;font-size:16px;width:100%}
  .pad .wide{grid-column:1/-1}
  #miss{font-size:13px;line-height:1.7;color:var(--dim);max-height:24vh;overflow:auto}
  #slog{font-size:14px;line-height:1.8;max-height:26vh;overflow:auto}
</style>
</head>
<body>
<div class="wrap">
  <h1 style="font-size:17px;color:var(--gold);text-align:center;margin-bottom:6px">📱 Máy quét thẻ</h1>
  <div id="conn">Đang kết nối…</div>

  <div id="vwrap">
    <video id="v" playsinline muted></video>
    <div id="cnt"><b id="n">0</b> <span id="nt" style="color:#cfe0ff">/ 0</span>
      <div class="hint" style="margin:2px 0 0;color:#cfe0ff" id="nw">thí sinh đã được quét</div></div>
  </div>

  <div id="state">Chờ màn hình chính…</div>

  <div class="pad">
    <button class="btn wide" id="camBtn">📷 Bật camera quét</button>
    <label class="btn alt" style="text-align:center">🖼 Chụp thẻ
      <input type="file" id="photo" accept="image/*" capture="environment" hidden></label>
    <button class="btn alt" id="bLife">📊 Hỏi khán giả</button>
    <button class="btn green wide" id="bMain">✅ Xong – hiện lựa chọn</button>
  </div>
  <div class="hint" id="msg" style="text-align:center"></div>

  <div class="box"><h3>Chưa quét được</h3><div id="miss">—</div></div>
  <div class="box"><h3>Vừa nhận</h3><div id="slog"></div></div>
  <p class="hint">Giữ điện thoại cách thẻ khoảng một đến hai mét, quét từng dãy.
    Kết quả cộng dồn nên quét nhiều lượt cũng được. Nếu camera không mở được, dùng “Chụp thẻ”:
    chụp một ảnh cả dãy đang giơ thẻ.</p>
</div>

<script src="vendor/zxing-reader.js"></script>
<script src="vendor/jsqr.js"></script>
<script src="vendor/peerjs.min.js"></script>
<script src="js/sound.js"></script>
<script src="js/qr.js"></script>
<script src="js/link.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const HOST=(location.hash||'').replace(/^#/,'').trim();
const WHY={locked:'đã chốt',phase:'chưa mở câu hỏi',noturn:'không đến lượt (đã bị loại?)',
  unknown:'thẻ không có trong danh sách'};
let st=null,hostSeen=0,sent={},cam=null;

function slog(t){const l=$('#slog');l.innerHTML=esc(t)+'<br>'+l.innerHTML.split('<br>').slice(0,24).join('<br>')}
function send(id,L){
  const k=sent[id],now=Date.now();
  if(k&&k.l===L&&now-k.t<2600)return;
  sent[id]={l:L,t:now};
  Link.send('scan',{id,l:L});Snd.scanOk();
}
function conn(){
  const up=Date.now()-hostSeen<9000;
  $('#conn').textContent=!Link.kind
    ?(HOST?'⏳ Đang kết nối tới màn hình chính…':'⚠ Thiếu mã ghép cặp. Hãy quét mã QR trên màn hình chính.')
    :(!Link.connected()?'🔴 Mất kết nối – đang thử lại…'
      :(up?'🟢 Đã nối với màn hình chính':'🟡 Đã vào kênh – đang chờ màn hình chính'));
}
function paint(){
  const d=st;
  if(!d){$('#state').textContent='Chờ màn hình chính…';return}
  $('#n').textContent=d.n||0;$('#nt').textContent='/ '+(d.tt||0);
  $('#nw').textContent=d.ph==='poll'?'khán giả đã bình chọn':'thí sinh đã được quét';
  const name=d.m==='warm'?'Khởi động':d.m==='rescue'?'Phao Hồi Sinh':d.m==='final'?'Chuông vàng':'Câu '+d.r;
  $('#state').textContent=
    d.ph==='collect'?`${name} · đang thu đáp án${d.t>0?' · còn '+d.t+'s':''}`
    :d.ph==='poll'?'Khán giả đang bình chọn'
    :d.ph==='choices'?`${name} · đã hiện lựa chọn, chờ công bố`
    :d.ph==='reveal'?`${name} · đã công bố đáp án`
    :d.ph==='over'?'Ván đã kết thúc'
    :d.ph==='ready'?'Sẵn sàng bắt đầu':'Chờ màn hình chính…';
  $('#miss').innerHTML=d.ph==='collect'
    ?(d.nmiss?`<b>Còn ${d.nmiss} em:</b><br>`+(d.miss||[]).map(esc).join('<br>')
       +(d.nmiss>(d.miss||[]).length?'<br>…':''):'Đã quét đủ cả lớp ✅')
    :'—';
  const b=$('#bMain'),life=$('#bLife');
  const set=(txt,cls,cmd)=>{b.textContent=txt;b.className='btn wide '+cls;b.disabled=!cmd;b.dataset.cmd=cmd||''};
  if(d.ph==='collect')set('✅ Xong – hiện lựa chọn','green','done');
  else if(d.ph==='choices')set('🔔 Công bố đáp án','','reveal');
  else if(d.ph==='reveal')set('Câu tiếp theo ▶','','next');
  else if(d.ph==='poll')set('Hiện bình chọn khán giả','','poll');
  else if(d.ph==='ready')set('Câu hỏi đầu tiên ▶','','next');
  else if(d.ph==='over')set('🏅 Bảng vinh danh','alt','pod');
  else set('Chờ màn hình chính','alt','');
  life.style.display=d.life?'block':'none';
}
$('#bMain').onclick=()=>{const c=$('#bMain').dataset.cmd;if(c)Link.send('cmd',{c})};
$('#bLife').onclick=()=>Link.send('cmd',{c:'life'});

Link.on('ack',d=>{
  hostSeen=Date.now();conn();
  if(!d||d.r==='dup')return;
  slog(d.r==='ok'?`✅ #${d.id} ${d.name||''} → ${d.l}`:`⚠ #${d.id} ${d.name||''}: ${WHY[d.r]||'không nhận'}`);
});
Link.on('state',d=>{hostSeen=Date.now();st=d;paint();conn()});

cam=QR.Cam($('#v'),send);
$('#camBtn').onclick=async()=>{
  Snd.unlock();
  if(cam.on){cam.stop();$('#camBtn').textContent='📷 Bật camera quét';$('#msg').textContent='';return}
  const r=await cam.start();
  if(r==='ok'){$('#camBtn').textContent='⏹ Tắt camera';$('#msg').textContent='Đang quét liên tục…'}
  else if(r==='nolib')$('#msg').textContent='Chưa tải được thư viện đọc QR.';
  else $('#msg').textContent='Không mở được camera. Trang phải chạy trên HTTPS và bạn cần cho phép dùng camera. Hãy dùng “Chụp thẻ”.';
};
$('#photo').onchange=e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  QR.fromFile(f,send,(n,err)=>{
    $('#msg').textContent=err||(n?`Đã đọc ${n} thẻ trong ảnh.`:'Không đọc được thẻ nào – chụp gần và sáng hơn.');
  });
};
QR.warmup().then(e=>{
  $('#msg').textContent = e==='zxing' ? 'Máy đọc sẵn sàng – quét được nhiều thẻ cùng lúc.'
    : e==='jsqr' ? 'Chỉ đọc được MỘT thẻ mỗi lần (máy đọc nhiều thẻ không chạy được ở đây).'
    : 'Chưa tải được thư viện đọc QR.';
});
setInterval(conn,2000);
Link.init('scanner',HOST,conn).then(()=>{conn();paint()});
conn();paint();
</script>
</body>
</html>
